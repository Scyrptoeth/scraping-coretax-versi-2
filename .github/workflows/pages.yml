name: Publish distribution site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python3 scripts/build-release.py
      - name: Preserve earlier public ZIP links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          directory=dist/site/download
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false) | . as $r | .assets[] | select(.name | endswith(".zip")) | [$r.tag_name,.name,.digest] | @tsv' > "$RUNNER_TEMP/published-zips"
          while IFS=$'\t' read -r tag name digest; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            [[ "$name" == "scraping-coretax-v2-${tag#v}.zip" ]] || continue
            if [[ ! -f "$directory/$name" ]]; then
              gh release download "$tag" --pattern "$name" --dir "$directory"
            fi
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            printf '%s  %s\n' "${digest#sha256:}" "$directory/$name" | sha256sum --check
          done < "$RUNNER_TEMP/published-zips"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v4
  prerelease:
    if: >-
      github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and publish the requested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./extension/manifest.json').version")
          tag="v$version"
          test "$(git log -1 --format=%s)" = "release: $tag"
          node --test tests/*.test.mjs
          python3 scripts/build-release.py
          cd dist/site/download
          sha256sum -c SHA256SUMS.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release already exists for $tag. Skipping publication."
            exit 0
          fi
          gh release create "$tag" "scraping-coretax-v2-$version.zip" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --title "Scraping Coretax Versi 2 · $tag" \
            --notes "Prarilis untuk pengujian. [Kemampuan yang diuji dan perbedaan dengan VERITAX](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/KESETARAAN.md)."
